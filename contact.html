	  <h1 id="positions-at-the-finance-research-group-igidr">Positions at the Finance Research Group, IGIDR</h1>
	  <p>We are looking for curious, motivated and research-inclined persons for research in financial regulation. The person will be required to support research in law and economics on a full-time basis. The position will involve working with persons from varying backgrounds such law, economics and management. It will require working with databases, analyses and designing policy and regulatory interventions. It will provide exposure to cutting edge research in finance.</p>
	  <p>Specifically, we are recruiting researchers to work in the following areas:</p>
	  <h3 id="policy-research-in-payments">Policy research in payments</h3>
	  <p>The framework of the payments and settlement systems, Indian and global, clearing processes in payments systems of different kinds, optimal competition policy in payments, policy issues and market barriers in payment systems, and how to design policy to ensure a vibrant fintech ecosystem.</p>
	  <p>The work profile will include studying contemporary policy developments, developing a point of view on the required reforms, writing policy papers and blog articles, running policy roundtables, etc.</p>
	  <h3 id="impact-of-interventions-in-financial-markets">Impact of interventions in financial markets</h3>
	  <p>Our research program on financial markets will involve studying the impact of changes in regulations on market quality, evaluation of proposed regulations, and development of a cost-benefit analysis of the same.</p>
	  <h3 id="quantitative-research-on-financial-markets">Quantitative research on financial markets</h3>
	  <p>Measuring and monitoring market quality of exchange traded securities. The measures aim to capture changes in price efficiency, liquidity and volatility over time. This will involve using modern statistical techniques, doing parallel computation with high frequency data in R. Impact of changes in regulations on market quality. Evaluation of proposed regulations, and development of a cost-benefit analysis of the same.</p>
	  
<b>Suitable candidates can send their resumes and a brief statement of purpose to Ms. Jyoti Manke at</b> <a href="mailto:careersatFRG@gmail.com">careersatFRG@gmail.com</a>
